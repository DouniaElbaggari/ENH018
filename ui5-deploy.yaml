# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.eiffage.sdt
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://vhefgds4cs.sap.eiffage.com:44300
          client: '400'
        app:
          name: ZSDSOMANAGE
          description: Sales Order Management
          package: ZSD_SDM_FIORI
          transport: 'DS4K900808'
        exclude:
          - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
